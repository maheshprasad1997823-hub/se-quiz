["Portability metrics include:",["% of target-dependent statements","Number of target systems","Response time","Screen refresh time"],"AB"],
["Generic RE activities:",["Elicitation","Analysis","Validation","Compiling"],"ABC"],
["About RE processes:",["Vary by domain, people and organisation","Are iterative with interleaved activities","Are always strictly sequential","Are identical everywhere"],"AB"],
["Elicitation stages:",["Requirements discovery","Classification and organization","Prioritization and negotiation","Code review"],"ABC"],
["Elicitation problems:",["Stakeholders don't know what they want","Stakeholders use their own terms","Stakeholders always agree","Conflicting requirements"],"ABD"],
["Process activities:",["Discovery includes domain requirements","Classification groups requirements into clusters","Negotiation resolves conflicts","Specification precedes discovery"],"ABC"],
["Interview types:",["Closed, pre-determined questions","Open, exploring issues","Normally a mix","Only closed interviews"],"ABC"],
["Effective interviewing:",["Be open-minded","Listen to stakeholders","Prompt with springboard questions, proposals or prototypes","Dominate the discussion"],"ABC"],
["Interviews in practice:",["Good for overall understanding of stakeholders' work","Suggest requirements rather than just asking","Interviewers must be open-minded","Best for domain requirements"],"ABC"],
["Problems with interviews:",["Specialist language is hard to follow","Not good for domain requirements","Familiar knowledge is hard to articulate","Ideal for domain requirements"],"ABC"],
["Process requirements may mandate:",["A particular IDE","A programming language","A development method","A screen colour"],"ABC"],
["Which requirements are written for customers in natural language?",["System requirements","User requirements","Domain requirements","Process requirements"],"B"],
["'Downtime shall not exceed five seconds a day' is what kind of requirement?",["Product","Organisational","External","Domain"],"A"],
["Which requirement type is a constraint from the domain of operation?",["User","Domain","Functional","Process"],"B"],
["A general intention of the user such as ease of use is a:",["Metric","Goal","Test case","Domain rule"],"B"]
]];
// ---- build 10 fixed sets of 20: 2 single-answer per set ----
const W=[4,3,4,5,4],SG=[[0,2,5,7],[0,3,5,8],[1,3,6,8],[1,4,6,9],[2,4,7,9]];
const S=T.map(a=>a.filter(q=>q[2].length==1)),M=T.map(a=>a.filter(q=>q[2].length>1)),ps=[0,0,0,0,0],pm=[0,0,0,0,0];
const ALL=[];let id=0;
for(let k=0;k<10;k++)for(let t=0;t<5;t++){let m=W[t];if(SG[t].includes(k)){ALL.push({id:id++,t,q:S[t][ps[t]++]});m--}for(let i=0;i<m;i++)ALL.push({id:id++,t,q:M[t][pm[t]++]})}
// ---- state ----
const $=s=>document.querySelector(s),app=$("#app"),L="A".charCodeAt(0);
let mem={};const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const load=()=>{try{return JSON.parse(st.get("se_quiz_results")||"[]")}catch(e){return[]}};
let name="",topics=new Set([0,1,2,3,4]),cur=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>ALL.filter(x=>topics.has(x.t));
const sets=()=>{const p=pool(),r=[];for(let i=0;i<p.length;i+=20)r.push(p.slice(i,i+20));return r};
function home(err){
 const sv=load();
 app.innerHTML=`<h1>MIT 2301 Software Engineering – Quiz</h1>
 <div class="card"><h2>Your name</h2><input type="text" id="nm" placeholder="Enter your name (required)" value="${esc(name)}">${err?`<p style="color:var(--bad)">${err}</p>`:""}</div>
 <div class="card"><h2>Topics</h2><div class="row">${TOP.map((x,i)=>`<span class="chip ${topics.has(i)?"on":""}" data-t="${i}">${x}</span>`).join("")}</div>
 <div class="row" style="margin-top:10px"><button class="sec" id="all">Select all</button><button class="sec" id="none">Clear</button></div></div>
 <div class="card"><h2>Quiz set</h2>${pool().length?`<div class="row">${sets().map((s,i)=>`<span class="chip" data-s="${i}">Set ${i+1} <span class="mu">(${s.length})</span></span>`).join("")}</div><p class="mu">Each set has up to 20 unique questions. Select all options that are correct – some questions have one answer, most have several. Wrong picks and missed correct answers cost points.</p>`:`<p class="mu">Select at least one topic.</p>`}</div>
 <button class="sec" id="hist">Results history (${sv.length})</button>`;
 document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>{name=$("#nm").value;const i=+e.dataset.t;topics.has(i)?topics.delete(i):topics.add(i);home()});
 $("#all").onclick=()=>{name=$("#nm").value;topics=new Set([0,1,2,3,4]);home()};$("#none").onclick=()=>{name=$("#nm").value;topics=new Set();home()};
 document.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{const n=$("#nm").value.trim();name=n;if(!n)return home("Please enter your name first.");start(+e.dataset.s)});
 $("#hist").onclick=history;
}
function start(i){const key=name.toLowerCase(),att=load().filter(r=>r.key==key).length+1;
 cur={set:i,qs:shuf(sets()[i]),ans:{},i:0,att,topics:[...topics]};show()}
function show(){const x=cur.qs[cur.i],q=x.q,multi=q[2].length>1,a=cur.ans[x.id]||new Set();
 app.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(name)} · Attempt ${cur.att} · Set ${cur.set+1}</b><span class="mu">${Object.values(cur.ans).filter(s=>s.size).length}/${cur.qs.length} answered</span></div>
 <div class="nav" style="margin:10px 0">${cur.qs.map((y,j)=>`<b class="${(cur.ans[y.id]||{size:0}).size?"done":""} ${j==cur.i?"cur":""}" data-j="${j}">${j+1}</b>`).join("")}</div>
 <div class="card"><div class="mu">Question ${cur.i+1} of ${cur.qs.length} · <span class="tag">${TOP[x.t].split(" – ")[0]}</span> · ${multi?"Select all that apply":"Select one answer"}</div>
 <h2>${esc(q[0])}</h2>${q[1].map((o,j)=>`<div class="opt ${a.has(j)?"sel":""}" data-o="${j}"><b>${String.fromCharCode(L+j)}.</b><span>${esc(o)}</span></div>`).join("")}</div>
 <div class="row"><button class="sec" id="pv" ${cur.i?"":"disabled"}>Previous</button><button class="sec" id="nx" ${cur.i<cur.qs.length-1?"":"disabled"}>Next</button><span style="flex:1"></span><button id="sub">Submit quiz</button></div>`;
 document.querySelectorAll("[data-j]").forEach(e=>e.onclick=()=>{cur.i=+e.dataset.j;show()});
 document.querySelectorAll("[data-o]").forEach(e=>e.onclick=()=>{const j=+e.dataset.o;let s=cur.ans[x.id]||new Set();if(!multi)s=new Set();s.has(j)?s.delete(j):s.add(j);cur.ans[x.id]=s;show()});
 $("#pv").onclick=()=>{cur.i--;show()};$("#nx").onclick=()=>{cur.i++;show()};
 $("#sub").onclick=()=>{const un=cur.qs.filter(y=>!(cur.ans[y.id]||{size:0}).size).length;if(confirm(un?`${un} question(s) unanswered and will lose points. Submit anyway?`:"Submit your answers?"))finish()}}
function score(q,s){const C=new Set([...q[2]].map(c=>c.charCodeAt(0)-L)),sel=s||new Set();let h=0,w=0;sel.forEach(j=>C.has(j)?h++:w++);const m=C.size-h;return{C,sel,h,w,m,pts:Math.max(-1,(h-w-m)/C.size)}}
function finish(){const res=cur.qs.map(x=>({x,...score(x.q,cur.ans[x.id])}));const tot=res.reduce((a,r)=>a+r.pts,0),n=res.length,pct=Math.max(0,tot/n*100);
 const rec={key:name.toLowerCase(),name,att:cur.att,set:cur.set+1,topics:cur.topics,date:new Date().toLocaleString(),pts:+tot.toFixed(2),n,pct:+pct.toFixed(1),full:res.filter(r=>r.pts==1).length};
 const all=load();all.push(rec);st.set("se_quiz_results",JSON.stringify(all));
 app.innerHTML=`<h1>Results – ${esc(name)} (Attempt ${cur.att}, Set ${cur.set+1})</h1><div class="card"><div class="big">${rec.pts} / ${n}</div><div>${rec.pct}% · ${rec.full} fully correct of ${n}</div><p class="mu">Per question: +1/k for each correct pick, −1/k for each wrong pick and for each missed correct answer (k = number of correct answers), minimum −1. Unanswered questions count as missed.</p></div>
 ${res.map((r,i)=>`<div class="card"><div class="mu">Q${i+1} · <b style="color:${r.pts>=1?"var(--ok)":r.pts>0?"inherit":"var(--bad)"}">${+r.pts.toFixed(2)} pts</b>${r.sel.size?"":" · unanswered"}</div><b>${esc(r.x.q[0])}</b>${r.x.q[1].map((o,j)=>`<div class="opt ${r.C.has(j)?"ok":r.sel.has(j)?"no":""}"><b>${String.fromCharCode(L+j)}.</b><span>${esc(o)}${r.C.has(j)?" ✓ correct":""}${r.sel.has(j)?(r.C.has(j)?" (you picked)":" ✗ you picked"):""}</span></div>`).join("")}</div>`).join("")}
 <div class="row"><button id="hm">Back to start</button><button class="sec" id="hs">History</button></div>`;
 $("#hm").onclick=()=>home();$("#hs").onclick=history;window.scrollTo(0,0)}
function history(){const sv=load().slice().reverse();
 app.innerHTML=`<h1>Results history</h1><div class="card sc">${sv.length?`<table><tr><th>Name</th><th>Att.</th><th>Set</th><th>Score</th><th>%</th><th>Date</th></tr>${sv.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.att}</td><td>${r.set}</td><td>${r.pts}/${r.n}</td><td>${r.pct}</td><td>${esc(r.date)}</td></tr>`).join("")}</table>`:"<p class='mu'>No attempts yet.</p>"}</div>
 <div class="row"><button id="hm">Back</button>${sv.length?'<button class="sec" id="cl">Clear history</button>':""}</div><p class="mu">History is stored in this browser only.</p>`;
 $("#hm").onclick=()=>home();const c=$("#cl");if(c)c.onclick=()=>{if(confirm("Delete all stored results?")){st.set("se_quiz_results","[]");history()}}}
home();
</script></body></html>
